name: Apply Ribbit Intelligence Phase 1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ribbit-phase1.yml

permissions:
  contents: write

jobs:
  apply-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Phase 1 files
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          root = Path('.')

          orchestrator_payload = ''.join(
              (root / '.ribbit_phase1' / name).read_text(encoding='utf-8').strip()
              for name in (
                  'orchestrator.01',
                  'orchestrator.02',
                  'orchestrator.rest',
              )
          )
          page_payload = (
              root / '.ribbit_phase1' / 'page.gz.b64'
          ).read_text(encoding='utf-8').strip()

          files = {
              root / 'bullfrog-intelligence-mvp/backend/app/orchestrator.py': orchestrator_payload,
              root / 'bullfrog-intelligence-mvp/frontend/app/page.tsx': page_payload,
          }

          for path, encoded in files.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(
                  gzip.decompress(base64.b64decode(encoded))
              )
              print(f'Updated {path}')
          PY

      - name: Validate Phase 1 markers
        shell: bash
        run: |
          grep -q 'customer_360' bullfrog-intelligence-mvp/backend/app/orchestrator.py
          grep -q '_fallback_plan_from_message' bullfrog-intelligence-mvp/backend/app/orchestrator.py
          grep -q 'Executive Dashboard' bullfrog-intelligence-mvp/frontend/app/page.tsx
          grep -q 'Customer 360' bullfrog-intelligence-mvp/frontend/app/page.tsx

      - name: Validate backend syntax
        run: |
          python -m py_compile bullfrog-intelligence-mvp/backend/app/orchestrator.py

      - name: Validate frontend build
        working-directory: bullfrog-intelligence-mvp/frontend
        run: |
          yarn install
          yarn build

      - name: Commit validated Phase 1 changes
        shell: bash
        run: |
          rm -rf .ribbit_phase1
          rm -f .github/workflows/apply-ribbit-phase1.yml

          git config user.name 'Ribbit Automation'
          git config user.email 'actions@users.noreply.github.com'

          git add bullfrog-intelligence-mvp/backend/app/orchestrator.py
          git add bullfrog-intelligence-mvp/frontend/app/page.tsx
          git add -A .ribbit_phase1 .github/workflows/apply-ribbit-phase1.yml

          git commit -m 'Add Ribbit Customer 360 and 429 fallback'
          git push origin main

